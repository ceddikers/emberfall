<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vesper art: poses, the Glass Knight</title>
<style>
  body { margin: 0; background: #151b26; color: #b8cce0; font: 12px Georgia, serif; }
  #grid { display: grid; grid-template-columns: repeat(4, 400px); gap: 4px; padding: 4px; }
  canvas { display: block; }
  #err { color: #ff9a8a; padding: 4px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="err"></div>
<div id="grid"></div>
<script>window.__errs = []; window.onerror = (m, s, l) => { window.__errs.push(m + ' (' + String(s).split('/').pop() + ':' + l + ')'); document.getElementById('err').textContent = window.__errs.join(' | '); };</script>
<script src="../../client/js/draw-util.js"></script>
<script src="../../client/js/data.js"></script>
<script src="../../client/js/bosses.js"></script>
<script src="../../client/js/arena/shapes.js"></script>
<script src="../../client/js/arena/boss-tells.js"></script>
<script src="../../client/js/arena/arena-view.js"></script>
<script src="../../client/js/vesper-art.js"></script>
<script>
  // ?pose=cone&tp=3.05&hold=3&zoom=3&angle=0&glass=1  draws one cell large; no query draws the whole sheet.
  // tp: seconds since the pose turned on. hold: for the cuts, how long the cast bar runs (the blow lands at hold; the swing is st.action as main.js sets it).
  // angle: the facing in radians (0 = east, PI/2 = south, -PI/2 = north). step: the Glass Knight's half-pace out of line. bg=dark: a dark backdrop.
  const Q = new URLSearchParams(location.search);
  const W = 400, H = 330;
  const DARK = Q.get('bg') === 'dark';
  // the hall's floor, roughly (polished moon-silver); the glass hall's is dimmer
  function backdrop(c, w, h, seed, glass) {
    const g = c.createLinearGradient(0, 0, 0, h);
    if (DARK) { g.addColorStop(0, '#05070e'); g.addColorStop(1, '#0b1220'); } else if (glass) { g.addColorStop(0, '#4c5b76'); g.addColorStop(1, '#627592'); } else { g.addColorStop(0, '#8793a8'); g.addColorStop(1, '#a3aec1'); }
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    const r = rng(seed || 7);
    for (let i = 0; i < 12; i++) { c.strokeStyle = 'rgba(40,56,86,0.12)'; c.lineWidth = 1; c.beginPath(); const y = r() * h; c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
    for (let i = 0; i < 6; i++) { c.strokeStyle = 'rgba(40,56,86,0.12)'; c.beginPath(); const x = r() * w; c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }
  }
  // Runs her from rest, turns the pose on at 1 s and draws the frame tp seconds into it (so the smoothing and the sequences are as they are in play).
  function bossCell(c, o) {
    const sc = o.scale || 1.3, st = { t: 0, moving: false, action: null, phase: 0, props: {} };
    const id = o.glass ? 'vesperglass' : 'vesper';
    const scratch = document.createElement('canvas'); scratch.width = scratch.height = 8; const sx = scratch.getContext('2d');
    const T = 1 + (o.tp || 0), ang = o.angle || 0;
    for (let tt = 0; tt <= T + 1e-6; tt += 1 / 60) {
      st.t = tt; st.moving = !!(o.moving && tt > 0.6); st.props = {}; st.action = null;
      if (o.pose && tt >= 1) st.props[VS_ART.KEYS[VS_ART.POSES.indexOf(o.pose)]] = true;
      if (o.hold != null && tt >= 0) st.action = { type: 'attack', t0: 1 + o.hold - 0.45, dur: 1.2 };
      if (o.plain != null && tt >= 1) st.action = { type: 'attack', t0: 1 + o.plain, dur: 1.0 };
      if (o.step) st.props.vsStep = o.step;
      if (tt < T - 1e-6) { sx.save(); sx.clearRect(0, 0, 8, 8); BOSS_ART[id](sx, st, ang); sx.restore(); }
    }
    c.save(); c.translate(W / 2 + (o.dx || 0), H / 2 + 38 + (o.dy || 0)); c.scale(o.zoom || 1, o.zoom || 1);
    drawBoss(c, { id }, 0, 0, ang, st, sc);
    c.restore();
  }
  const CELLS = [
    ['rest', c => bossCell(c, { tp: 0.5 })],
    ['walk', c => bossCell(c, { moving: true, tp: 2 })],
    ['cone, wind-up', c => bossCell(c, { pose: 'cone', tp: 2.2, hold: 3 })],
    ['cone, cut', c => bossCell(c, { pose: 'cone', tp: 3.1, hold: 3 })],
    ['close, wind-up', c => bossCell(c, { pose: 'close', tp: 2.2, hold: 3 })],
    ['close, mid-cut', c => bossCell(c, { pose: 'close', tp: 3.07, hold: 3 })],
    ['far, wind-up', c => bossCell(c, { pose: 'far', tp: 2.2, hold: 3 })],
    ['far, mid-cut', c => bossCell(c, { pose: 'far', tp: 3.1, hold: 3 })],
    ['cross L, wind-up', c => bossCell(c, { pose: 'crossL', tp: 2.2, hold: 3 })],
    ['cross L, cut', c => bossCell(c, { pose: 'crossL', tp: 3.1, hold: 3 })],
    ['cross R, wind-up', c => bossCell(c, { pose: 'crossR', tp: 2.2, hold: 3 })],
    ['cross R, cut', c => bossCell(c, { pose: 'crossR', tp: 3.15, hold: 3 })],
    ['ring, wind-up (north)', c => bossCell(c, { pose: 'ring', tp: 2.2, hold: 3, angle: -Math.PI / 2 })],
    ['ring, struck (north)', c => bossCell(c, { pose: 'ring', tp: 3.35, hold: 3, angle: -Math.PI / 2 })],
    ['buster, raised', c => bossCell(c, { pose: 'buster', tp: 2.2, hold: 3, angle: Math.PI / 2 })],
    ['buster, down', c => bossCell(c, { pose: 'buster', tp: 3.5, hold: 3, angle: Math.PI / 2 })],
    ['kneel', c => bossCell(c, { pose: 'kneel', tp: 2.2 })],
    ['plant, raised', c => bossCell(c, { pose: 'plant', tp: 0.8, angle: Math.PI / 2 })],
    ['plant, standing', c => bossCell(c, { pose: 'plant', tp: 2.4, angle: Math.PI / 2 })],
    ['dash, stance', c => bossCell(c, { pose: 'dash', tp: 1.4, moving: true })],
    ['dash, cut', c => bossCell(c, { pose: 'dash', tp: 3.1, hold: 3, moving: true })],
    ['enrage', c => bossCell(c, { pose: 'enrage', tp: 1.5 })],
    ['intro, 0.9 s', c => bossCell(c, { pose: 'intro', tp: 0.9, angle: Math.PI / 2 })],
    ['intro, 2.6 s', c => bossCell(c, { pose: 'intro', tp: 2.6, angle: Math.PI / 2 })],
    ['death, 1.4 s', c => bossCell(c, { pose: 'death', tp: 1.4 })],
    ['death, 2.6 s', c => bossCell(c, { pose: 'death', tp: 2.6 })],
    ['plain chop', c => bossCell(c, { plain: 0.5, tp: 0.8 })],
    ['facing north (up)', c => bossCell(c, { angle: -Math.PI / 2, tp: 0.5 })],
    ['facing south (down)', c => bossCell(c, { angle: Math.PI / 2, tp: 0.5 })],
    ['facing east', c => bossCell(c, { angle: 0, tp: 0.5 })],
    ['facing west', c => bossCell(c, { angle: Math.PI, tp: 0.5 })],
    ['facing north-east, cone', c => bossCell(c, { pose: 'cone', tp: 2.2, hold: 3, angle: -0.8 })],
    ['facing south-west, cone cut', c => bossCell(c, { pose: 'cone', tp: 3.1, hold: 3, angle: 2.4 })],
    ['GLASS rest', c => bossCell(c, { glass: true, tp: 0.5, angle: Math.PI / 2 }), true],
    ['GLASS rest, facing north', c => bossCell(c, { glass: true, tp: 0.5, angle: -Math.PI / 2 }), true],
    ['GLASS cone cut', c => bossCell(c, { glass: true, pose: 'cone', tp: 3.1, hold: 3, angle: Math.PI / 2 }), true],
    ['GLASS half a pace out of line', c => bossCell(c, { glass: true, tp: 1.5, step: 1, angle: Math.PI / 2 }), true],
    ['GLASS kneel', c => bossCell(c, { glass: true, pose: 'kneel', tp: 2 }), true],
    ['GLASS far, mid-cut', c => bossCell(c, { glass: true, pose: 'far', tp: 3.1, hold: 3 }), true],
    ['GLASS crossR, cut', c => bossCell(c, { glass: true, pose: 'crossR', tp: 3.15, hold: 3 }), true],
    ['GLASS intro 1.2 s', c => bossCell(c, { glass: true, pose: 'intro', tp: 1.2, angle: Math.PI / 2 }), true],
  ];
  if (Q.get('perf')) {   // how long a frame of each costs
    const cv = document.createElement('canvas'); cv.width = 600; cv.height = 400; const c = cv.getContext('2d'), st = { t: 0, moving: false, action: null, phase: 0, props: { vsCone: true } };
    const time = (n, fn) => { const t0 = performance.now(); for (let i = 0; i < n; i++) fn(i); return ((performance.now() - t0) / n).toFixed(3); };
    const real = time(400, i => { st.t = i / 60; c.save(); c.translate(300, 200); c.scale(1.3, 1.3); BOSS_ART.vesper(c, st, i * 0.01); c.restore(); });
    const gl = { t: 0, moving: false, action: null, phase: 0, props: {} };
    const glass = time(400, i => { gl.t = i / 60; c.save(); c.translate(300, 200); c.scale(1.3, 1.3); BOSS_ART.vesperglass(c, gl, i * 0.01); c.restore(); });
    document.getElementById('err').textContent = 'ms/frame: vesper ' + real + ', glass knight ' + glass;
  }
  const grid = document.getElementById('grid');
  if (Q.get('strip')) {   // ?strip=cone&hold=3.2&angle=0&glass=1&us=-2.6,-1.8,... : one move across its cast and landing, a cell per moment (us: seconds from the landing)
    const pose = Q.get('strip'), hold = +Q.get('hold') || 3.2, ang = +Q.get('angle') || 0, glass = Q.get('glass') === '1', z = +Q.get('zoom') || 1.15;
    const us = (Q.get('us') || '-2.8,-2.0,-1.2,-0.6,-0.25,-0.08,0.04,0.14,0.3,0.55,1.0').split(',').map(Number);
    grid.style.cssText = 'display:flex;flex-wrap:nowrap;gap:2px;padding:2px';
    for (const u of us) {
      const cv = document.createElement('canvas'); cv.width = 250; cv.height = 300; grid.append(cv);
      const c = cv.getContext('2d'); backdrop(c, 250, 300, 5, glass);
      c.save(); c.translate(-75, -15);
      bossCell(c, { pose: pose === 'rest' ? null : pose, tp: hold + u, hold, angle: ang, glass, zoom: z, scale: 1.1 });
      c.restore();
      c.font = '12px Georgia'; c.fillStyle = Math.abs(u) < 0.01 ? '#a01010' : 'rgba(10,18,36,0.95)'; c.fillText((u >= 0 ? '+' : '') + u.toFixed(2) + ' s' + (u === 0 ? ' (lands)' : ''), 8, 16);
    }
  } else if (Q.get('pose') || Q.get('one')) {
    const cv = document.createElement('canvas'); cv.width = 960; cv.height = 760; grid.style.display = 'block'; grid.append(cv);
    const glass = Q.get('glass') === '1';
    const c = cv.getContext('2d'); backdrop(c, 960, 760, 3, glass);
    const z = +Q.get('zoom') || 3;
    c.save(); c.translate(480 - W / 2, 400 - H / 2);
    const o = { pose: Q.get('pose') === 'rest' || !Q.get('pose') ? null : Q.get('pose'), tp: +Q.get('tp') || 0, hold: Q.get('hold') != null ? +Q.get('hold') : null, angle: +Q.get('angle') || 0, moving: Q.get('moving') === '1', zoom: z, glass, step: +Q.get('step') || 0, plain: Q.get('plain') != null ? +Q.get('plain') : null };
    bossCell(c, o); c.restore();
  } else if (Q.get('from') != null || Q.get('n') != null) {
    // a slice of the sheet: ?from=0&n=12
    const from = +Q.get('from') || 0, n = +Q.get('n') || 12;
    for (const [label, fn, glass] of CELLS.slice(from, from + n)) {
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H; grid.append(cv);
      const c = cv.getContext('2d'); backdrop(c, W, H, label.length * 13, glass);
      try { fn(c); } catch (e) { window.__errs.push(label + ': ' + e.message + ' ' + (e.stack || '').split('\n')[1]); document.getElementById('err').textContent = window.__errs.join(' | '); }
      c.font = '12px Georgia'; c.fillStyle = glass || DARK ? 'rgba(210,225,245,0.95)' : 'rgba(10,18,36,0.95)'; c.fillText(label, 8, 16);
    }
  } else for (const [label, fn, glass] of CELLS) {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; grid.append(cv);
    const c = cv.getContext('2d'); backdrop(c, W, H, label.length * 13, glass);
    try { fn(c); } catch (e) { window.__errs.push(label + ': ' + e.message + ' ' + (e.stack || '').split('\n')[1]); document.getElementById('err').textContent = window.__errs.join(' | '); }
    c.font = '12px Georgia'; c.fillStyle = glass || DARK ? 'rgba(210,225,245,0.95)' : 'rgba(10,18,36,0.95)'; c.fillText(label, 8, 16);
  }
</script>
</body>
</html>
