<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boss attack motion: strips</title>
<style>
  body { margin: 0; background: #151b26; color: #b8cce0; font: 12px Georgia, serif; }
  #grid { display: flex; flex-wrap: wrap; gap: 2px; padding: 2px; }
  canvas { display: block; }
  #err { color: #ff9a8a; padding: 4px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="err"></div>
<div id="grid"></div>
<script>window.__errs = []; window.onerror = (m, s, l) => { window.__errs.push(m + ' (' + String(s).split('/').pop() + ':' + l + ')'); document.getElementById('err').textContent = window.__errs.join(' | '); };</script>
<script src="../../client/js/draw-util.js"></script>
<script src="../../client/js/data.js"></script>
<script src="../../client/js/arena/bosses/archmage.js"></script>
<script src="../../client/js/bosses.js"></script>
<script src="../../client/js/arena/shapes.js"></script>
<script src="../../client/js/arena/boss-tells.js"></script>
<script src="../../client/js/arena/arena-view.js"></script>
<script src="../../client/js/set3-sky.js"></script>
<script src="../../client/js/titan-art.js"></script>
<script>
  // ?orig_<name>=<url> loads an earlier copy of that art file instead (before/after)
  (function () { const q = new URLSearchParams(location.search); for (const n of ["archmage","corvane","brannoc","caelum","hood","sovereign","morrowoak","wyrm","hydra"]) document.write('<script src="' + (q.get('orig_' + n) || '../../client/js/' + n + '-art.js') + '"><' + '/script>'); })();
</script>
<script src="../../client/js/volkar-storm.js"></script>
<script src="../../client/js/grubnak-fx.js"></script>
<script>
  // A strip of one boss's attack at chosen moments. The action is what main.js gives a cast: { type: 'attack', t0, dur 1.2 }, the cast ends (the blow lands) 0.45 s
  // after t0 (a boss auto: dur 1.0, the same landing). Cells are the seconds since t0 (default -0.2 .. 1.1).
  //   ?boss=corvane  &props=raise,stance:comet  &angle=E|S|N|W  &us=-0.2,0.15,...  &dur=1.2  &zoom=1.5  &w=230&h=260  &raid=1  &perf=1  &noimpact=1
  const Q = new URLSearchParams(location.search);
  const BID = Q.get('boss') || 'corvane';
  const UPR = new Set(['caelum', 'hood', 'seraph']);
  const MANG = { E: 0, S: Math.PI / 2, N: -Math.PI / 2, W: Math.PI }[Q.get('angle') || 'E'];
  const MDUR = +Q.get('dur') || 1.2, T0 = 1.0;
  const MUS = (Q.get('us') || '-0.25,0.12,0.28,0.38,0.45,0.52,0.66,0.95').split(',').map(Number);
  const MW = +Q.get('w') || 230, MH = +Q.get('h') || 250, ZOOM = +Q.get('zoom') || (UPR.has(BID) ? 1.15 : 1.5);
  const MPROPS = {};
  for (const f of (Q.get('props') || '').split(',').filter(Boolean)) { const [k, v] = f.split(':'); MPROPS[k] = v === undefined ? true : (isNaN(+v) ? v : +v); }
  const MEXTRA = Q.get('raid') ? { raid: true } : {};
  const sx = document.createElement('canvas'); sx.width = sx.height = 8; const sctx = sx.getContext('2d');
  function stateAt(u) {
    const st = Object.assign({ t: 0, moving: false, action: null, phase: 0, props: {} }, MEXTRA), end = T0 + u;
    for (let tt = 0; tt <= end + 1e-6; tt += 1 / 60) {
      st.t = tt; st.props = tt >= 0.3 ? Object.assign({}, MPROPS) : {};
      st.action = { type: 'attack', t0: T0, dur: MDUR };
      if (tt < end - 1e-6) { sctx.save(); sctx.clearRect(0, 0, 8, 8); try { BOSS_ART[BID](sctx, st, MANG); } finally { sctx.restore(); } }
    }
    return st;
  }
  function backdrop(c, w, h) {
    const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#59647a'); g.addColorStop(1, '#6d7a92');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.strokeStyle = 'rgba(20,30,50,0.18)'; c.lineWidth = 1;
    for (let x = 0; x < w; x += 46) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }
    for (let y = 0; y < h; y += 46) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
  }
  const grid = document.getElementById('grid');
  if (Q.get('probe')) {   // the blade's tip frame by frame (bladeSmear's history under this key): when it moves fastest and when it has arrived
    const key = Q.get('probe'), st = { t: 0, moving: false, action: null, phase: 0, props: {} }, rows = [], c = sx.getContext('2d');
    for (let tt = 0; tt <= T0 + 1.2; tt += 1 / 60) {
      st.t = tt; st.props = tt >= 0.3 ? Object.assign({}, MPROPS) : {}; st.action = { type: 'attack', t0: T0, dur: MDUR };
      c.save(); c.clearRect(0, 0, 8, 8); try { BOSS_ART[BID](c, st, MANG); } finally { c.restore(); }
      const h = st._sm && st._sm[key], e = h && h[h.length - 1]; if (e && tt >= T0) rows.push([tt - T0, e[2], e[3]]);
    }
    let best = 0, bu = 0, sp = [];
    for (let i = 1; i < rows.length; i++) { const v = Math.hypot(rows[i][1] - rows[i - 1][1], rows[i][2] - rows[i - 1][2]); sp.push([rows[i][0], v]); if (v > best) { best = v; bu = rows[i][0]; } }
    const arr = sp.find(r => r[0] > bu && r[1] < best * 0.25);
    document.getElementById('err').textContent = 'PROBE ' + BID + ' ' + key + ': peak tip speed ' + best.toFixed(1) + ' px/frame at +' + bu.toFixed(3) + ' s; below a quarter of it from +' + (arr ? arr[0].toFixed(3) : 'n/a') + ' s (the cast ends at +0.450)';
  } else if (Q.get('perf')) {   // ms per draw of the pose at each moment (the same state drawn 300 times; the first cell, before the swing, is the old code's cost: the pose without a beat)
    const cv = document.createElement('canvas'); cv.width = 900; cv.height = 700; const c = cv.getContext('2d'), out = [], oy = UPR.has(BID) ? 480 : 350;   // (big enough that nothing is clipped away)
    if (Q.get('nosmear')) window.bladeSmear = () => {};
    for (const u of MUS) {
      const st = stateAt(u); for (let i = 0; i < 40; i++) { c.save(); c.clearRect(0, 0, 900, 700); c.translate(450, oy); c.scale(1.2, 1.2); BOSS_ART[BID](c, st, MANG); c.restore(); }
      const t0 = performance.now(), n = 300;
      for (let i = 0; i < n; i++) { c.save(); c.clearRect(0, 0, 900, 700); c.translate(450, oy); c.scale(1.2, 1.2); BOSS_ART[BID](c, st, MANG); c.restore(); }
      out.push([u, (performance.now() - t0) / n]);
    }
    const held = out[0][1], mean = out.reduce((a, r) => a + r[1], 0) / out.length, peak = Math.max(...out.map(r => r[1]));
    document.getElementById('err').textContent = 'PERF ' + BID + ' held ' + held.toFixed(3) + ' ms, mean over the swing ' + mean.toFixed(3) + ' ms (' + (mean / held * 100 - 100).toFixed(0) + '%), worst cell ' + peak.toFixed(3) + ' ms (' + (peak / held * 100 - 100).toFixed(0) + '%)';
  } else {
    for (const u of MUS) {
      const cv = document.createElement('canvas'); cv.width = MW; cv.height = MH; grid.append(cv);
      const c = cv.getContext('2d'); backdrop(c, MW, MH);
      try {
        const st = stateAt(u);
        c.save(); c.translate(MW / 2, MH / 2 + (UPR.has(BID) ? 90 : 0)); c.scale(ZOOM, ZOOM);
        drawBoss(c, { id: BID }, 0, 0, MANG, st, 1);
        c.restore();
      } catch (e) { window.__errs.push(u + ': ' + (e && e.stack || e)); document.getElementById('err').textContent = window.__errs.join(' | '); }
      c.fillStyle = Math.abs(u - 0.45) < 0.01 ? '#ffb0a0' : '#e8eef8'; c.font = '13px Georgia'; c.fillText((u >= 0 ? '+' : '') + u.toFixed(2) + ' s' + (Math.abs(u - 0.45) < 0.01 ? '  (lands)' : ''), 8, 16);
    }
  }
  window.__ready = true;
</script>
</body>
</html>
